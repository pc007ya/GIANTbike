<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-2T6SIjyWVkLyYURRi3N4dWRogTV8ARJXbLUQmcu6UCo='; style-src 'sha256-c92L9tlt+BTDik8/bCFAjhkam/myB5sJV1/5IBHY9As='; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
<meta name="robots" content="noindex,nofollow">
<title>GIANTbike｜供應商帳號流程預覽</title><style>
:root{color-scheme:light;--ink:#172331;--muted:#4d5d6c;--line:#dbe3ea;--paper:#fff;--bg:#eef3f6;--blue:#153e60;--teal:#067365;--pale:#dff6ef;--amber:#704704;--warn:#fff4dc;--navy:#102941}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif}button{font:inherit;cursor:pointer;color:inherit}.shell{max-width:1040px;margin:auto;padding:0 24px}.top{background:var(--navy);color:white;padding:26px 0 31px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.mark{display:inline-block;color:#72e0c8;font-weight:800;letter-spacing:.11em;font-size:13px}.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--pale);color:#095849;white-space:nowrap}.pill:before{content:"";height:6px;width:6px;border-radius:50%;background:currentColor}.top .pill{background:#e8f7fc;color:#184965}.top h1{font-size:clamp(29px,4.7vw,46px);letter-spacing:.015em;line-height:1.17;margin:15px 0 10px}.top p{margin:0;color:#cedce6;max-width:650px}.note{border:1px solid #ead59d;background:var(--warn);color:#513a12;padding:11px 15px;border-radius:13px;margin:20px 0;font-size:14px}.note strong{color:var(--amber)}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:17px}.stage{color:var(--muted);border:1px solid var(--line);background:#f6f8fa;display:flex;align-items:center;padding:9px 11px;gap:9px;border-radius:12px;font-size:13px}.stage .n{display:grid;place-items:center;border-radius:50%;width:23px;height:23px;flex:0 0 23px;background:#e6edf2;font-weight:700}.stage.current{border-color:#408f82;background:#e6f6f2;color:#0a5147;font-weight:700}.stage.current .n{background:#167365;color:white}.stage.checked .n{background:var(--pale);color:#095849}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,1fr);gap:16px;align-items:start}.card{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:0 8px 23px #10294108}.sub{margin:0 0 4px;color:var(--teal);font-weight:800;font-size:12px;letter-spacing:.09em}.card h2{font-size:24px;line-height:1.25;letter-spacing:.025em;margin:4px 0 11px}.card p{margin:8px 0 16px;color:var(--muted)}.card h3{font-size:16px;margin:20px 0 8px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{padding:9px 13px;background:var(--navy);color:white;border:1px solid transparent;border-radius:9px;font-weight:700;text-align:left}.btn:hover{background:#264b6a}.btn.alt{color:var(--blue);background:#f4f7fa;border-color:#cdd9e4}.btn.alt:hover{background:#e7eef4}.btn.danger{color:#834235;background:#fff7f4;border-color:#ead3ce}.btn:focus-visible{outline:3px solid #158f81;outline-offset:3px}.btn[disabled]{cursor:not-allowed;opacity:.5}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.choice{padding:12px;text-align:left;background:#f7fafb;border:1px solid var(--line);border-radius:11px}.choice:hover,.choice[aria-pressed=true]{background:#e6f5f1;border-color:#408f82}.choice small{display:block;color:var(--muted)}.row{margin:6px 0 10px;border-radius:10px;background:#f3f7fa;padding:9px 12px}.row strong{font-size:13px}.row code{overflow-wrap:anywhere;color:var(--blue);font-size:13px}.mini{font-size:13px;color:var(--muted)}.result{min-height:45px;margin:12px 0 0;padding:10px 12px;background:#eef4f7;border-left:3px solid #53718d;border-radius:7px}.result[data-kind=bad]{background:#fff1e9;border-color:#b04131}.result[data-kind=ok]{background:var(--pale);border-color:var(--teal)}.trace{list-style:none;padding:0;margin:12px 0 0}.trace li{display:grid;grid-template-columns:23px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #edf1f4}.trace li:last-child{border-bottom:0}.trace span{color:var(--teal);font-weight:800;font-size:12px}.trace p{margin:0;font-size:13px}.footer{color:var(--muted);padding:18px 0 25px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px}.linkbtn{background:none;border:0;color:var(--blue);text-decoration:underline;padding:3px 0}.empty{color:var(--muted);font-size:13px}.sectionline{padding-top:12px;margin-top:17px;border-top:1px solid var(--line)}.screen-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:720px){.shell{padding:0 15px}.grid{grid-template-columns:1fr}.card{padding:16px}.stage{font-size:12px;padding:7px;gap:5px}.stage .n{width:18px;height:18px;flex-basis:18px}.options{grid-template-columns:1fr}.brand{align-items:flex-start}}@media(max-width:440px){.flow{grid-template-columns:repeat(2,1fr)}.top{padding:20px 0}.card h2{font-size:22px}}
</style></head>
<body><header class="top"><div class="shell"><div class="brand"><span class="mark">GIANTbike / ACCOUNT FLOW</span><span class="pill">互動預覽・非正式站</span></div><h1>供應商帳號流程</h1><p>看管理員開戶、承辦人設定密碼，與 Google 如何綁到同一個帳號。</p></div></header>
<main class="shell"><div class="note" role="note"><strong>本頁為合成資料示範。</strong> 不連 Firebase 或 Google，不寄信，不讀取正式資料，也不需要輸入真實帳密。</div>
<nav class="flow" aria-label="示範步驟"><div class="stage" data-stage="0"><span class="n">1</span>管理員開戶</div><div class="stage" data-stage="1"><span class="n">2</span>承辦人設密碼</div><div class="stage" data-stage="2"><span class="n">3</span>廠商登入</div><div class="stage" data-stage="3"><span class="n">4</span>啟用 Google</div></nav>
<div class="grid"><section class="card" id="main-card" aria-label="互動操作"></section>
<aside class="card" aria-label="示範結果"><p class="sub">即時回饋</p><h2>驗收紀錄</h2><div id="result" class="result" role="status" aria-live="polite"></div><p id="no-trace" class="empty">完成操作後，這裡會留下本次示範步驟。</p><ol class="trace" id="trace"></ol></aside></div>
<noscript><p>要操作純前端的示範，請啟用 JavaScript。本頁不連正式服務。</p></noscript>
<footer class="footer"><span>靜態預覽｜重整後不保留模擬資料</span><button type="button" class="linkbtn" id="reset">重設示範</button></footer></main>
<script>
(() => {
'use strict';
const el=id=>document.getElementById(id);
const fake={a:{name:'測試廠商 A',email:'operator-a@example.invalid',uid:'demo-uid-a',report:'DEMO-A-001｜虛構盤點記錄'},b:{name:'測試廠商 B',email:'operator-b@example.invalid',uid:'demo-uid-b',report:'DEMO-B-001｜虛構試驗記錄'}};
const btn=(id,label,s='')=>'<button type="button" class="btn '+s+'" id="'+id+'">'+label+'</button>';
let role='',who='a',step=0,log=[],note={txt:'只操作合成測試身分，沒有真實帳號。',kind:''},lastUID='';
let data=construct();
function construct(){return {a:{enabled:false,password:false,attached:false,active:false},b:{enabled:true,password:true,attached:false,active:false}}}
function update(msg,kind=''){note={txt:msg,kind};log.unshift(msg);render()}
function handle(id,fn){const x=el(id);if(x)x.addEventListener('click',fn)}
function reset(){role='';who='a';step=0;log=[];lastUID='';data=construct();note={txt:'示範已重設。',kind:''};render()}
function choices(){return '<div class="options">'+Object.keys(fake).map(k=>'<button type="button" class="choice" id="vendor-'+k+'" aria-pressed="'+(who===k)+'"><strong>'+fake[k].name+'</strong><small>'+fake[k].email+'</small></button>').join('')+'</div>'}
function login(provider){const d=data[who], k=fake[who];if(!d.enabled || (provider==='密碼'&&!d.password)||(provider==='Google'&&!d.active)){update(provider==='Google'?'拒絕：尚未完成 Google 綁定，不能查看供應商資料。':'拒絕：先由管理員開戶，再完成示範密碼設定。','bad');return}
role='member';lastUID=k.uid;step=provider==='Google'?3:2;update(provider+'登入成功：'+k.name+'。識別碼 '+k.uid+'。','ok');}
function show(){
 const a=fake[who], d=data[who];
 if(role==='admin') return '<p class="sub">管理員操作</p><h2>為供應商承辦人開戶</h2><p>每位承辦人都有自己的帳號，並由管理員指定所屬廠商。這裡的公司與信箱都是虛構的。</p>'+choices()+'<div class="row"><strong>目前狀態：</strong>'+(d.enabled?'已開戶':'未開戶')+'　<strong>預配識別碼：</strong><code>'+a.uid+'</code></div><div class="controls">'+btn('invite','產生模擬邀請')+btn('go-setup','預覽承辦人設定頁','alt')+btn('go-home','回訪客首頁','alt')+'</div><p class="mini">示範只改畫面狀態，不建立正式帳號、不寄信，也不顯示任何真實設定連結。</p>';
 if(role==='setup') return '<p class="sub">承辦人帳號設定</p><h2>驗證公司信箱、自設密碼</h2><p>正式版會使用邀請連結。這裡不要求輸入任何帳密，只用按鈕模擬完成。</p>'+choices()+'<div class="row"><strong>帳號：</strong><code>'+a.email+'</code></div><div class="controls">'+btn('set-password','模擬驗證與設定密碼')+btn('go-signin','到廠商登入','alt')+btn('go-admin','返回管理員畫面','alt')+'</div>';
 if(role==='signin') return '<p class="sub">承辦人登入</p><h2>選擇測試身分</h2><p>用合成帳號示範登入，不會開啟真實 Google 視窗。</p>'+choices()+'<div class="controls">'+btn('password-login','模擬帳密登入')+btn('google-login','模擬 Google 登入','alt')+btn('go-home','回訪客首頁','alt')+'</div>';
 if(role==='member')return '<p class="sub">我的帳號｜'+a.name+'</p><h2>供應商帳號設定</h2><div class="row"><strong>帳號識別碼：</strong><code data-uid="'+a.uid+'">'+a.uid+'</code></div><div class="row"><strong>Google 狀態：</strong>'+(d.active?'已啟用':d.attached?'已選擇，待密碼確認':'未綁定')+'</div><div class="controls">'+(d.active?'':d.attached?btn('verify-bind','模擬重新驗證密碼，啟用綁定'):btn('choose-google','選擇模擬 Google 帳號'))+btn('do-signout','登出並試另一種登入','alt')+'</div><h3 class="sectionline">盤點與測試報告</h3><div class="row"><strong>可見：</strong><span id="demo-report">'+a.report+'</span></div><div class="controls">'+btn('try-other','檢查是否可查看另一廠商','alt')+'</div><p class="mini">示範檢查：切換登入方式不會換帳號；切換廠商會換成另一組合成資料。</p>';
 return '<p class="sub">公開目錄 / 測試入口</p><h2>訪客可查治具，廠商紀錄需登入</h2><p>這是候選版「開戶、登入、Google 綁定」的互動示範。正式供應商資料不會載入。</p><div class="controls">'+btn('go-admin','從管理員開戶開始')+btn('go-signin','試已開戶的廠商 B','alt')+'</div><div class="sectionline"><span class="pill">公開訪客不需匿名登記</span><p class="mini">公開治具仍可使用既有 GitHub Pages 查詢。預覽只呈現帳號流程，不替換正式查詢站。</p></div>';
}
function render(){
 el('main-card').innerHTML=show();
 for(const [id,s] of Object.entries(fake))handle('vendor-'+id,()=>{who=id;render();el('vendor-'+id)?.focus()});
 handle('go-admin',()=>{role='admin';step=0;update('進入模擬管理員開戶畫面。')});
 handle('go-home',()=>{role='';step=0;update('已返回公開訪客示範。')});
 handle('go-setup',()=>{role='setup';step=1;update('模擬開啟承辦人設定頁。')});
 handle('invite',()=>{data[who].enabled=true;update('已模擬開戶：'+fake[who].name+'。沒有寄出任何電子郵件。','ok')});
 handle('set-password',()=>{if(!data[who].enabled){update('尚未開戶，先返回管理員畫面。','bad');return}data[who].password=true;update('已模擬信箱驗證及自設密碼。','ok')});
 handle('go-signin',()=>{if(!role)who='b';role='signin';step=2;update('請選測試帳號和示範登入方式。')});
 handle('password-login',()=>login('密碼'));
 handle('google-login',()=>login('Google'));
 handle('choose-google',()=>{data[who].attached=true;step=3;update('已選擇 '+fake[who].email+' 的模擬 Google 帳號；還不能使用 Google 登入。','ok')});
 handle('verify-bind',()=>{data[who].active=true;step=3;update('已模擬重新驗證並啟用綁定。兩種登入保留原識別碼 '+lastUID+'。','ok')});
 handle('do-signout',()=>{role='signin';step=2;update('已退出合成身分。可用同一帳號試 Google 登入。')});
 handle('try-other',()=>update('拒絕：'+fake[who].name+'不能看另一廠商資料。','bad'));
 for(const x of document.querySelectorAll('.stage')){const n=Number(x.dataset.stage);x.classList.toggle('checked',n<step);x.classList.toggle('current',n===step);if(n===step)x.setAttribute('aria-current','step');else x.removeAttribute('aria-current')}
 el('result').textContent=note.txt;el('result').dataset.kind=note.kind;
 const trace=el('trace');trace.replaceChildren();
 log.slice(0,6).forEach((v,i)=>{const li=document.createElement('li'),num=document.createElement('span'),d=document.createElement('p');num.textContent=String(log.length-i).padStart(2,'0');d.textContent=v;li.append(num,d);trace.append(li)});
 el('no-trace').hidden=log.length>0;
}
el('reset').addEventListener('click',reset);render();
})();
</script></body></html>
